spring:
  application:
    name: kidtrip-backend

server:
  # 参照工程用的是 8002。这里用 8003 —— 两个工程可以同时跑，互不抢端口。
  #
  # ⚠️ 若启动报 "Port 52562 was already in use"：说明环境里存在 SERVER__PORT 变量。
  #    Spring Boot 的配置优先级是：命令行参数 > 环境变量 > 本文件。
  #    所以环境变量会**悄悄盖掉**这里的 8003，而且不报任何警告。
  #    绕开：unset SERVER__PORT && mvn spring-boot:run
  #    或压过它：mvn spring-boot:run -Dspring-boot.run.arguments=--server.port=8003
  port: 8003

# ── 飞猪 CLI 接入 ─────────────────────────────────────────────
# 这三个值都是"这台机器的事实"，所以放在配置里，不写死在 Java 代码里。
# 换电脑 / 换 node / CLI 挪了位置，只改这里。
kidtrip:
  flyai:
    # node 可执行文件。写 "node" = 交给 PATH 去找（实测可行）。
    # 若报"启动飞猪查询进程失败"，把它改成本机 node.exe 的绝对路径，例如：
    #   node-path: D:/Program Files/nodejs/node.exe
    node-path: node

    # 为什么指向 dist/flyai-bundle.cjs，而不是那个 flyai.cmd：
    # npm 在 Windows 上装的 flyai 是个 .cmd 批处理 shim，Java 执行不了它，
    # 只能绕道 cmd.exe /c，参数会被 cmd 再解析一遍 —— 多一层就多一类错。
    # 直接让 node 跑 bundle，参数从 Java 直达 node，中间没有任何解释器。
    # 飞猪 CLI 的 bundle 绝对路径。**这里故意不留默认值** ——
    # npm 全局目录装在哪台机器的哪个用户下，是"这台机器的事实"，不是项目配置。
    # 写死在本文件里会连带把用户名一起提交进仓库，而且换台机器直接跑不起来。
    #   怎么配：启动前 export FLYAI_CLI_PATH=<你的路径>
    #   Windows 上通常长这样（%APPDATA% 展开后）：
    #     C:/Users/<你>/AppData/Roaming/npm/node_modules/@fly-ai/flyai-cli/dist/flyai-bundle.cjs
    #   找不到它：npm root -g 会告诉你全局 node_modules 在哪。
    # 与上面 llm.api-key 是同一条规矩：**只从环境变量注入，不在仓库里留默认值。**
    cli-path: ${FLYAI_CLI_PATH:}

    # 单次调用的上限。CLI 每次都要冷启动一个 Node 进程（~750 毫秒）+ 网络往返，
    # 实测单次 1.3~2.7 秒，所以给到 120 秒——但注意它只是"兜底不无限等"。
    # 真正让用户不干等的办法是"少查几次 + 缓存"，不是把这个数字调大。
    timeout-seconds: 120

    # ── B3 新增：限流友好 ───────────────────────────────────────
    # 两次 CLI 调用之间的最小间隔。**这不是优化，是能不能用的前提**：
    #   实测并发 6 个 → 3 个 429；连续串行 6 个不间隔 → 后 3 个 451（风控）；
    #   冷却 90 秒后，串行 + 间隔 7 秒的 4 次调用**全部成功**。
    # 3000 是"够用且不慢"的折中：一次规划通常只发 2~3 次调用，多花 3~6 秒换成功率。
    # 想复现限流现象（教学用），把它改成 0 再连续调几次接口。
    min-gap-ms: 3000

    # 同一组查询条件的结果缓存多久。同一个规划会话里反复调接口不会重复花额度。
    # 10 分钟足够覆盖"用户改一个偏好再生成一次"的交互节奏，又不会拿到隔夜的价格。
    cache-ttl-seconds: 600

    # ── 酒店档次筛选（B4c 新增，2026-10-14 改为多档）──────────────────
    # 发给 search-hotel 的 --hotel-stars 值。**空串 = 关掉筛选**（想复现原现象就写 ""）。
    #
    # 加它的原因：飞猪默认按价格升序给酒店，而在酒店这个品类里"价格升序"约等于
    # "把最差的排前面"。实测（深圳，2026-10-24 入住）不带筛选回来 10 条，**6 条是青旅/日租公寓**：
    #     舒坦时光青年公寓 ¥27 · 百联住宿公寓 ¥49 · 几米舍青年客栈 ¥44 · 悦梦小舍青年旅舍 ¥32
    # 全是"经济型"。
    #
    # ⚠️ 2026-10-14：默认从 "4,5" 改成 "3;4"。原来的 4,5 只挡了"下限"，
    #    代价是用户**只看得到豪华档**（上海实测：皇冠假日 ¥478 / JW万豪 ¥1039 / 索菲特 ¥1277）。
    #    实测出来的档位对照（上海，2026-11-17 入住，同一日期同一城市）：
    #      不带筛 → 9 条全"经济型" ¥33~345，其中 2 条是青旅/公寓
    #      "3"    → 10 条全"舒适型"（如家/维也纳/汉庭）¥103~314，**0 条青旅**
    #      "4"    → 10 条"四星级/高档型"（假日/和颐）¥140~895
    #      "4,5"  → 9 条全"豪华型"（皇冠假日/JW万豪）¥478~1277
    #
    # ── 为什么是**两个档位**而不是一个值 ─────────────────────────────
    #   ⚠️ 上游的 `--hotel-stars` **一次只回一档**，多值不是并集 —— 这是实测出来的，
    #      和 `--help` 的字面意思（"Star rating 1-5, comma-separated"）完全不一样：
    #        "3,4" → 全"舒适型"    "2,3" → 全"舒适型"    "3,4,5" → 全"舒适型"
    #      也就是说传一组值拿不到"这一组里各档都有"，只会拿到其中某一档。
    #   所以"给用户看到不同价位的选择"只能靠**查两次**（见 RetrievalService.hotelStarTiers）。
    #   代价是一次规划多一次上游调用 —— 实测单次 search-hotel 约 2.5 秒，在 30 秒总预算里付得起。
    #
    #   分隔符的分工：**分号分组、逗号传参**。`"3;4"` = 查两次（--hotel-stars 3 / --hotel-stars 4）；
    #   `"4,5"` = 查一次（--hotel-stars 4,5）。这样老写法依然可用，语义也不会混。
    #
    # ⚠️ 注意：`star` 字段回传的是中文档次词（"豪华型"/"高档型"/"舒适型"/"经济型"），**不是数字**。
    #    而且只有**带入离日期**时才回传 —— 不带日期查，star 全是 null。这也是为什么必须带日期。
    hotel-stars: "3;4"

    # ── 城际交通时长上限（B7 新增）──────────────────────────────────
    # 单位分钟。**这是这个项目唯一那条产品约束的落点**：带孩子出行，每一段移动都不能太长。
    # 拿它去查飞猪 search-train 的 --total-duration-hour，并在本地做最终判定。
    #
    # 180 = 3 小时。实测（2026-10-13，广州出发，--total-duration-hour 3）之下真实可走的几条：
    #   广州→珠海 53 分 · 广州→汕头 87 分 · 珠海→深圳 104 分 · 深圳→汕头 102 分 · 汕头→厦门 84 分
    # 最长一条 104 分，所以调到 120 也一条都不丢；调到 90 会开始丢（珠海↔深圳 104 分就没了）。
    #
    # ⚠️ 上游那个参数是**小时**（整数），所以我们会向上取整成小时再发（150 → 3 小时 = 180 分钟）。
    #    也就是说上游那层只是粗筛，真正的红线在本地这条 180 上 —— 改这里就够了。
    # ⚠️ 它没有"关掉"这个状态（不像 hotel-stars 有空串=不筛）：
    #    "不限时长"等于取消核心约束，想放宽就把数字调大。
    max-leg-minutes: 180

    # ── 预跑缓存落盘（B8 新增）────────────────────────────────────
    # 空串 = 不落盘（纯内存，和加这个配置之前完全一样）。填了路径就启用。
    #
    # 为什么需要它：现场演示最常见的动作是**重启后端**，而纯内存缓存一重启就没了。
    # 而那时上游可能已经查不动（实测连续串行 6 个不间隔，后 3 个直接 451）。
    # 配上路径之后：
    #   提前跑一遍预跑 → 结果留在磁盘上 → 演示当天启动就直接命中，那几趟车次一次上游都不发。
    #
    # ⚠️ 启用时**必须同时把 cache-ttl-seconds 调长**。它默认只有 600 秒（10 分钟），
    #    预跑和演示之间要是隔了一晚，磁盘上的结果一启动就全过期了 —— 等于没预跑。
    #    推荐：预跑和演示都用同一份配置（见 _probe/prerun.mjs 里写好的那组参数）。
    cache-file: ""

  # ── B4 新增：大模型（OpenAI 兼容）──────────────────────────────
  # 本项目用的是**百炼 · 通义千问**（qwen3.8-flash），但它接的是 OpenAI 兼容协议，
  # 所以 langchain4j 用 OpenAiChatModel 就能连；换 base-url + 模型名即可换厂商
  # （DeepSeek / 通义 / 自建 vLLM 都是这一条路）—— 这也是当初选它的理由。
  llm:
    # ⚠️ 密钥**只从环境变量注入**，这里故意不留默认值。
    #    为什么：写进仓库的密钥等于泄露（参照工程里那个 DeepSeek key 就是这么漏的，
    #    而且它还以 `:sk-...` 的形式躺在文件里，看着像"有默认值"，其实那就是泄露本身）。
    #    怎么配：启动前 export KIDTRIP_LLM_API_KEY=sk-xxxx
    #    没配会怎样：**启动就失败**，报一句人话（见 LlmProperties）。
    #    我们选择"启动就报错"而不是"用到才报错"，因为一个连模型都连不上的规划服务，
    #    让它起来只会让人以为"跑起来了"，然后在点生成时才发现 —— 那是更差的失败方式。
    #
    # ⚠️ 两种 key 不要混：百炼控制台直接申请的 key 走公网 dashscope；
    #    `sk-ws-...` 这种**工作区密钥**只对专属网关
    #    （https://ws-<id>.<region>.maas.aliyuncs.com/compatible-mode/v1）有效，
    #    打公网会 401 invalid_api_key。
    api-key: ${KIDTRIP_LLM_API_KEY:}
    base-url: ${KIDTRIP_LLM_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model-name: ${KIDTRIP_LLM_MODEL_NAME:qwen-plus}
    # ⚠️⚠️ 千问 3.x 系列**默认开着思考**，而思考 token 全是白等的时间：
    #   实测（同一句请求、同一个 qwen3.8-flash）不关思考 9843 token（8866 是思考），
    #   且非流式请求在思考期间线上零字节流动 → 网关当空闲连接在 ~30 秒掐掉，
    #   客户端只看到 `IOException: EOF reached while reading`（现象是"全都超时"）。
    #   关掉 → 519 token、11 秒。所以这项不是调优，是能不能用。
    #
    #   这是**三态**（见 LlmProperties.enableThinking）：
    #     不写这一行 = 请求体里一个字节都不加（= 用厂商默认）
    #     false      = 显式关掉思考（千问必须）
    #   换 DeepSeek / OpenAI 官方这类不认该字段的厂商时，请把整行**删掉**，不要改成 true。
    enable-thinking: ${KIDTRIP_LLM_ENABLE_THINKING:false}
    # 温度：这一步要的是"稳定的结构"，不是"创意"。
    # 0.3 —— 排期与文案允许一点变化，但 JSON 结构必须稳。
    #
    # ⚠️ B5 之后这里有个已知的取舍，说清楚免得你以后反复纠结：
    #    现在**三条**调用都共用这一个模型实例（对话画像 / 规划检索条件 / 排行程），
    #    而它们的理想温度并不一样 —— 对话要的是自然口语（0.7~1.0 更舒服），
    #    另外两条要的是稳定结构（0.3）。但 ChatModel 是个单例 bean，
    #    temperature 是它的构建参数，一次只能给一个值。
    #    三个选择：
    #      ① 共用 0.3（现在这样）—— 对话的语气会稍微"板"一点，但三个步骤的 JSON 都稳；
    #      ② 共用 0.7 —— 对话自然了，但排行程时漏字段、写错编号的概率会上升；
    #      ③ 建两个 bean（一个 0.7 给对话，一个 0.3 给另外两个）—— 最精确，
    #         代价是多一个 HTTP 客户端实例、多一份配置、以及"哪个类用哪个 bean"要读代码才知道。
    #    现在选 ①，因为**三个里有两个怕随机，只有一个怕生硬** —— 按多数派决策。
    #    哪天对话的语气成了真实抱怨，再上 ③（那时会有明确的证据支撑这次改动）。
    #    这仍然是"温度影响抽样随机性、不影响准确性"那条 —— 事实的准确性靠白名单，不靠温度。
    temperature: 0.3
    # 单次调用上限。DeepSeek 出一份 3 天行程的 JSON 实测 10~30 秒，给到 90 秒留余量。
    timeout-seconds: 90
